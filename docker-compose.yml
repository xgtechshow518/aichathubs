# AIChatsHub — local Docker environment
#
# Compose project name "aichathubs" -> Docker Desktop shows a single
# "aichathubs" group with the three child containers:
#   aichathubs-db  /  aichathubs-backend  /  aichathubs-frontend
#
# Published host ports default to the standard 5432 / 8080 / 5173 and can be
# overridden from a git-ignored root .env file (see .env.example) if those
# ports are already in use on your machine:
#   DB_PORT / BACKEND_PORT / FRONTEND_PORT
name: aichathubs

services:
  # ---- Database -------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: aichathubs-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_live_chats
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_live_chats"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - aichathubs

  # ---- Backend (Go / Echo) -------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aichathubs-backend
    # Secrets (Gemini / Stripe / Google / SMTP / JWT / admin) come from
    # backend/.env; the values below override host/network specifics so the
    # containers can talk to each other regardless of published ports.
    env_file:
      - ./backend/.env
    environment:
      SERVER_PORT: "8081"
      LISTEN_HOST: "0.0.0.0"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/smart_live_chats?sslmode=disable"
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      CORS_ORIGINS: "http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}"
      GOOGLE_REDIRECT_URL: "http://localhost:${BACKEND_PORT:-8080}/api/auth/google/callback"
      WHATSAPP_DB_PATH: "file:/data/whatsapp_sessions.db?_foreign_keys=on"
    ports:
      - "${BACKEND_PORT:-8080}:8081"
    volumes:
      - wa-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aichathubs

  # ---- Frontend (React / Vite dev server) ----------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: aichathubs-frontend
    environment:
      # Browser-facing URLs -> the backend's published host port.
      # These override any frontend/.env values (Vite gives process.env
      # precedence over .env files).
      VITE_API_URL: "http://localhost:${BACKEND_PORT:-8080}"
      VITE_WS_URL: "ws://localhost:${BACKEND_PORT:-8080}"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - aichathubs

volumes:
  db-data:
  wa-data:

networks:
  aichathubs:
    name: aichathubs
